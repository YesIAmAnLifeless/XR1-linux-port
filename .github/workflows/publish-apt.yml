name: Publish XR1 APT Repository

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: xr1-apt-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Install repository tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Import APT signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -eu

          test -n "$APT_SIGNING_KEY"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import

          gpg --list-secret-keys \
            3D716D8D1075FC96E58960E32228113FB65117F4

      - name: Download XR1 package
        run: |
          set -eu

          mkdir -p site/pool

          curl --fail --location --silent --show-error \
            "https://github.com/YesIAmAnLifeless/XR1-linux-port/releases/download/v1.0.1/xr1-wine_1.0.1-1.deb" \
            --output site/pool/xr1-wine_1.0.1-1.deb

          dpkg-deb --info site/pool/xr1-wine_1.0.1-1.deb

          test "$(dpkg-deb -f site/pool/xr1-wine_1.0.1-1.deb Package)" = "xr1-wine"

      - name: Generate package indexes
        run: |
          set -eu

          mkdir -p site/dists/stable/main/binary-all

          cd site

          # Generate the index from the site root so filenames start with pool/.
          dpkg-scanpackages pool /dev/null \
            > dists/stable/main/binary-all/Packages

          grep -q '^Package: xr1-wine$' \
            dists/stable/main/binary-all/Packages

          grep -q '^Filename: pool/xr1-wine_1.0.1-1.deb$' \
            dists/stable/main/binary-all/Packages

          gzip -9 -n -c \
            dists/stable/main/binary-all/Packages \
            > dists/stable/main/binary-all/Packages.gz

          echo "Generated package index:"
          grep -E '^(Package|Version|Architecture|Filename|Size|SHA256):' \
            dists/stable/main/binary-all/Packages

          cd ..

      - name: Generate and sign repository metadata
        env:
          KEY_FPR: 3D716D8D1075FC96E58960E32228113FB65117F4
        run: |
          set -eu

          apt-ftparchive release site/dists/stable \
            > /tmp/release-fields

          {
            echo "Origin: XR1 Linux Port"
            echo "Label: XR1 Linux Port"
            echo "Suite: stable"
            echo "Codename: stable"
            echo "Architectures: all"
            echo "Components: main"
            cat /tmp/release-fields
          } > site/dists/stable/Release

          gpg --batch --yes \
            --local-user "$KEY_FPR" \
            --clearsign \
            --output site/dists/stable/InRelease \
            site/dists/stable/Release

          gpg --batch --yes \
            --armor \
            --detach-sign \
            --local-user "$KEY_FPR" \
            --output site/dists/stable/Release.gpg \
            site/dists/stable/Release

          gpg --batch --export "$KEY_FPR" \
            > site/xr1-archive-keyring.gpg

          test -s site/dists/stable/InRelease
          test -s site/dists/stable/Release.gpg
          test -s site/xr1-archive-keyring.gpg

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
