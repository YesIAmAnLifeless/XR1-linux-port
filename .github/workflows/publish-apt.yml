
name: Publish XR1 APT Repository

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: xr1-apt-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Import APT signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          test -n "$APT_SIGNING_KEY"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          gpg --list-secret-keys

      - name: Download XR1 package
        run: |
          mkdir -p site/pool
          curl --fail --location --silent --show-error \
            "https://github.com/YesIAmAnLifeless/XR1-linux-port/releases/download/v1.0.1/xr1-wine_1.0.1-1.deb" \
            -o site/pool/xr1-wine_1.0.1-1.deb
          dpkg-deb --info site/pool/xr1-wine_1.0.1-1.deb

      - name: Generate package indexes
        run: |
          mkdir -p site/dists/stable/main/binary-all
          dpkg-scanpackages --arch all site/pool /dev/null \
            > site/dists/stable/main/binary-all/Packages
          gzip -9 -n -c \
            site/dists/stable/main/binary-all/Packages \
            > site/dists/stable/main/binary-all/Packages.gz

      - name: Generate and sign repository metadata
        env:
          KEY_FPR: 3D716D8D1075FC96E58960E32228113FB65117F4
        run: |
          apt-ftparchive release site/dists/stable > /tmp/release-fields

          {
            echo "Origin: XR1 Linux Port"
            echo "Label: XR1 Linux Port"
            echo "Suite: stable"
            echo "Codename: stable"
            echo "Architectures: all"
            echo "Components: main"
            cat /tmp/release-fields
          } > site/dists/stable/Release

          gpg --batch --yes --local-user "$KEY_FPR" \
            --clearsign \
            --output site/dists/stable/InRelease \
            site/dists/stable/Release

          gpg --batch --yes --armor --detach-sign \
            --local-user "$KEY_FPR" \
            --output site/dists/stable/Release.gpg \
            site/dists/stable/Release

          gpg --batch --export "$KEY_FPR" \
            > site/xr1-archive-keyring.gpg

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

